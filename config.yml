# ===== Настройки мониторинга =====

tickers:
  - TSLA

# ==========================================================
#  РЕЖИМ «ПЕРВЫЙ ЧАС» — пробой диапазона открытия (основной)
#  Время по Нью-Йорку (ET). Алматы = ET + 10 часов зимой.
# ==========================================================
orb:
  enabled: true
  briefing_at: "09:00"     # 19:00 Алматы — брифинг: уровни вчера/премаркет, гэп
  range_minutes: 15        # диапазон открытия = первые 15 минут (19:30–19:45)
  window_end: "10:30"      # сигналы только до 20:30 Алматы
  summary_at: "11:30"      # 21:30 Алматы — итог: какие сигналы сработали
  max_loss_pct: 1.0        # максимальный стоп, % от входа (её правило −1%)
  reward_risk: 1.5         # цель = 1.5 × риск (по проверке на истории лучше, чем 2)
  min_score: 3             # сколько из 4 условий должно совпасть
  allow_short: false       # шорт выключен: на истории шорты были в минусе

# ==========================================================
#  Старые сигналы по 15-минутным свечам (всплеск объёма и т.п.)
#  Выключены, чтобы не мешали. Включить: true
# ==========================================================
candle_alerts: false
interval: "15m"
include_prepost: true
big_candle_pct: 1.5
volume_spike_mult: 2.5
engulfing: true
hammer_star: true
three_in_row: true
levels:
  TSLA: [400]

poll_seconds: 20           # как часто проверять, секунд
chart_candles: 60
